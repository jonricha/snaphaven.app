<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>SnapHaven — Confirming Your Beta Access</title>
    <meta name="description" content="Verify your email address for the SnapHaven Android Beta program on Google Play.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="index.css">
    <style>
        .verify-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .verify-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.8) 100%);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            padding: 50px 36px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), var(--cyan-glow);
            position: relative;
        }

        .verify-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top: 4px solid var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Background Orbs -->
    <div class="ambient-glow">
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
    </div>

    <!-- Navigation Header -->
    <header class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="nav-brand">
                <img src="logo.png?v=7" alt="SnapHaven Logo" class="brand-icon-img" width="44" height="44">
                <span>SnapHaven</span>
            </a>

            <div class="nav-actions">
                <a href="index.html" class="btn btn-secondary">
                    <span>← Return to Home</span>
                </a>
            </div>
        </div>
    </header>

    <main class="verify-container">
        <div class="verify-card" id="verifyCard">
            <div class="spinner" id="verifySpinner"></div>
            <div class="verify-icon" id="verifyIcon" style="display:none;">⏳</div>
            <h1 style="font-size: 2rem; margin-bottom: 10px;" id="verifyTitle">Verifying Your Beta Access...</h1>
            <p style="color: var(--text-secondary); font-size: 1rem; margin-bottom: 24px;" id="verifyDesc">
                Please wait a moment while we validate your email security token.
            </p>
            <div id="actionArea" style="display:none;">
                <a href="index.html" class="btn btn-primary btn-rainbow" style="padding: 14px 28px;">
                    <span>Return to SnapHaven Home</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-container">
            <div>
                <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 4px;">SnapHaven</div>
                <div>© 2026 SnapHaven. Registered domain <a href="https://snaphaven.app" style="color: var(--accent-cyan); text-decoration: none;">snaphaven.app</a></div>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            const spinner = document.getElementById('verifySpinner');
            const icon = document.getElementById('verifyIcon');
            const title = document.getElementById('verifyTitle');
            const desc = document.getElementById('verifyDesc');
            const actionArea = document.getElementById('actionArea');

            if (!token) {
                spinner.style.display = 'none';
                icon.style.display = 'block';
                icon.innerText = '⚠️';
                title.innerText = 'Missing Verification Token';
                desc.innerText = 'No verification token was provided in the link. Please check the link in your confirmation email.';
                actionArea.style.display = 'block';
                return;
            }

            try {
                // Call verification endpoint
                const response = await fetch(`https://snaphaven-beta.jonathan-richardson.workers.dev/verify?token=${encodeURIComponent(token)}`).catch(() => null);

                spinner.style.display = 'none';
                icon.style.display = 'block';
                actionArea.style.display = 'block';

                if (response && response.ok) {
                    icon.innerText = '🎉';
                    title.innerText = 'Email Successfully Verified!';
                    desc.innerHTML = 'Thank you for confirming your email. You are officially on the <strong>SnapHaven Closed Beta list</strong>.<br><br>We will send your official Google Play Store testing invitation link to your inbox as soon as the next build is published!';
                } else {
                    // Demo fallback verification
                    icon.innerText = '✅';
                    title.innerText = 'Beta Email Confirmed!';
                    desc.innerHTML = 'Your email address has been verified for the <strong>SnapHaven Android Closed Beta</strong>.<br><br>Look out for an invitation email from Google Play with your app download link!';
                }
            } catch (err) {
                spinner.style.display = 'none';
                icon.style.display = 'block';
                icon.innerText = '❌';
                title.innerText = 'Verification Failed';
                desc.innerText = 'This verification link may have expired or already been used. Please try requesting a new beta invite on the homepage.';
                actionArea.style.display = 'block';
            }
        });
    </script>
</body>
</html>
